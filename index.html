<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Merge Defense</title>
    <style>
      html, body { margin: 0; height: 100%; background: #12141c; overflow: hidden; }
      /* Vùng game nằm trong safe area (inset thay padding vì Phaser đo kích thước bằng getBoundingClientRect). */
      #game {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        touch-action: none;
        overflow: hidden;
      }
      /* Chặn chọn chữ chỉ trên canvas; ô nhập tên (DOM) và trang /admin không bị ảnh hưởng. */
      #game canvas {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
